<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORCA Dashboard - Fisherman</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <!-- Floating Layer Controls -->
        <div id="layer-controls" class="floating-controls">
            <h4 class="controls-title">MAP LAYERS</h4>
            <label class="toggle-label"><input type="checkbox" id="toggle-pfz" checked> PFZ Zones</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-weather" checked> Weather/Storm</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-route" checked> Route</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-sst"> Sea Surface Temperature</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-chl"> Chlorophyll</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-eez"> EEZ Boundary</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-sectors"> Sectors</label>
        </div>

        <!-- Floating Legend -->
        <div id="legend-box" class="floating-legend hidden">
            <h4 id="legend-title" class="controls-title">Legend</h4>
            <img id="legend-img" src="" alt="Layer Legend" />
        </div>

        <!-- Main Map Area -->
        <main id="map"></main>

        <!-- Sidebar for Chat & Verdict -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>ORCA <span id="persona-title">FISHERMAN PORTAL</span></h1>
            </header>

            <div class="persona-switcher">
                <button type="button" class="persona-btn active" data-mode="fishing">Fisherman</button>
                <button type="button" class="persona-btn" data-mode="commercial">Commercial</button>
            </div>

            <div id="verdict-panel" class="verdict-panel status-unknown">
                <div class="verdict-header">
                    <div>
                        <span class="verdict-title">SYSTEM STATUS</span>
                        <span id="freshness-indicator" class="freshness-indicator hidden"></span>
                    </div>
                    <span id="verdict-badge" class="badge">AWAITING QUERY</span>
                </div>
                <div id="verdict-reason" class="verdict-reason">
                    No active mission selected.
                </div>
            </div>

            <div style="padding: 10px 20px;">
                <button id="export-btn" class="hidden" style="width: 100%; padding: 8px; background-color: var(--accent-marine); color: var(--bg-dark); border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Export Advisory (PDF)</button>
            </div>
            <div class="trace-container">
                <div class="trace-header" id="trace-toggle">
                    <span>SYSTEM TRACE (DAG)</span>
                    <span id="trace-icon">▼</span>
                </div>
                <div class="trace-content hidden" id="trace-content">
                    <ul id="trace-list"></ul>
                </div>
            </div>

            <div id="chat-history" class="chat-history">
                <div class="message system-msg">
                    <strong>ORCA SYSTEM:</strong> Ready to assist. Please specify your query (e.g., "Is it safe to fish near Rameswaram?").
                </div>
            </div>

            <div class="chat-input-area">
                <div id="loading-indicator" class="loading-indicator hidden">
                    <span class="spinner"></span> 
                    Processing maritime data...
                </div>
                <form id="chat-form">
                    <input type="text" id="chat-input" placeholder="Enter coordinates, mission, or ask for a route..." autocomplete="off" required>
                    <button type="submit" id="send-btn">TRANSMIT</button>
                </form>
            </div>
        </aside>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
