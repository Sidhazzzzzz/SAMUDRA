<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORCA Dashboard - Fisherman</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <!-- Floating Layer Controls -->
        <div id="layer-controls" class="floating-controls">
            <h4 class="controls-title">MAP LAYERS</h4>
            
            <div class="basemap-toggle" style="margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                <div style="font-size: 0.8em; color: var(--text-muted); margin-bottom: 4px;">BASEMAP</div>
                <label class="toggle-label"><input type="radio" name="basemap" value="satellite" checked> Satellite</label>
                <label class="toggle-label"><input type="radio" name="basemap" value="dark"> Dark Matter</label>
            </div>
            
            <div style="font-size: 0.8em; color: var(--text-muted); margin-bottom: 4px;">OVERLAYS</div>
            <label class="toggle-label"><input type="checkbox" id="toggle-pfz" checked> PFZ Zones</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-weather" checked> Weather/Storm</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-route" checked> Route</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-sst"> Sea Surface Temperature</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-chl"> Chlorophyll</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-eez"> EEZ Boundary</label>
            <label class="toggle-label"><input type="checkbox" id="toggle-sectors"> Sectors</label>
        </div>

        <!-- Floating Legend -->
        <div id="legend-box" class="floating-legend hidden">
            <h4 id="legend-title" class="controls-title">Legend</h4>
            <img id="legend-img" src="" alt="Layer Legend" />
        </div>

        <!-- Main Map Area -->
        <main id="map"></main>

        <!-- Sidebar for Chat & Verdict -->
        <aside class="sidebar">

            <div class="sidebar-top">
                <header class="sidebar-header">
                    <h1>ORCA <span id="persona-title">FISHERMAN PORTAL</span></h1>
                </header>
                <div class="persona-switcher">
                    <button type="button" class="persona-btn active" data-mode="fishing">Fisherman</button>
                    <button type="button" class="persona-btn" data-mode="commercial">Commercial</button>
                </div>
            </div>

            <div class="sidebar-status-card" id="verdict-panel">
                <div class="status-row">
                    <div class="status-label">SYSTEM STATUS</div>
                    <span id="freshness-indicator" class="freshness-indicator hidden"></span>
                    <span id="verdict-badge" class="badge" style="margin-left: auto;">AWAITING QUERY</span>
                </div>
                <div class="status-divider"></div>
                <div id="verdict-reason" class="verdict-reason">
                    No active mission selected.
                </div>
                <div class="status-divider"></div>
                <button type="button" class="primary-btn secondary-btn-style" id="trace-toggle" style="width: 100%;">VIEW SYSTEM TRACE (DAG)</button>
            </div>

            <div id="metrics-strip" class="metrics-strip hidden">
                <!-- Keep the SVG metrics the same, they fit the design -->
                <div class="metric-gauge" id="metric-hmi">
                    <svg viewBox="0 0 36 36" class="circular-chart">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle" id="hmi-arc" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div class="metric-info">
                        <span class="val" id="hmi-val">--</span>
                        <span class="lbl">HMI</span>
                    </div>
                </div>
                <div class="metric-gauge" id="metric-efficiency">
                    <svg viewBox="0 0 36 36" class="circular-chart">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle" id="eff-arc" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div class="metric-info">
                        <span class="val" id="eff-val">--</span>
                        <span class="lbl">Route Eff.</span>
                    </div>
                </div>
            </div>

            <div id="chat-history" class="chat-history">
                <div class="message system-msg">
                    <strong>ORCA SYSTEM:</strong> Ready to assist. Please specify your query (e.g., "Is it safe to fish near Rameswaram?").
                </div>
                <!-- Advisory messages will get the PDF export button attached to them in JS -->
            </div>

            <div class="chat-input-area">
                <div id="loading-indicator" class="loading-indicator hidden">
                    <span class="spinner"></span> 
                    Processing maritime data...
                </div>
                <form id="chat-form">
                    <input type="text" id="chat-input" placeholder="Enter coordinates, mission, or ask for a route..." autocomplete="off" required>
                    <button type="submit" id="send-btn" class="primary-btn">TRANSMIT</button>
                </form>
            </div>

        </aside>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Full-screen DAG Modal -->
    <div id="dag-modal" class="dag-modal hidden">
        <div class="dag-modal-content">
            <button id="dag-close-btn" class="dag-close-btn">&times;</button>
            <h2>SYSTEM TRACE (DAG)</h2>
            <div class="dag-pipeline-container">
                <div class="dag-line-bg"></div>
                <div class="dag-line-fill" id="dag-line-fill"></div>
                <div class="dag-nodes" id="dag-nodes">
                    <!-- Nodes injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
